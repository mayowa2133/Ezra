[project]
name = "clipper"
version = "0.1.0"
description = "Local clipping operator: campaign footage in, agent-judged short clips out, performance fed back"
authors = [
    { name = "mayowa2133", email = "adesanym@mcmaster.ca" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
clipper = "clipper:main"

[project.optional-dependencies]
local = [
    "faster-whisper>=1.2.1",
    "opencv-python-headless>=4.8,<5",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "scikit-image>=0.26.0",
]
