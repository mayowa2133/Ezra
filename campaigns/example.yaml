# A campaign is the contract the AI clips against. Everything here reaches the
# judge through `get_brief`; duration, profanity, forbidden terms, competitors
# and required hashtags are also enforced in code.
campaign:
  id: campaign-184              # what you type: clipper run campaign-184
  name: Podcast XYZ
  platform: Content Rewards

  rate:
    cpm: 2.00                   # $ per 1,000 qualified views
  minimum_views: 5000           # a post below this earns nothing
  maximum_payout: 1000          # cap per post
  # budget: 5000                # optional cap for the whole campaign

  requirements:
    min_duration: 15
    max_duration: 60

  forbidden:
    - profanity                 # checked against the transcript
    - competitor mentions       # checked against `competitors`
  competitors: []
  forbidden_terms: []

  required:
    - creator visible           # judgment call: the agent and you check it
    - subtitles                 # always burned in by clipper
    - campaign hashtag          # every caption must include `hashtags`
  hashtags: ["#podcastxyz"]

  platforms: [tiktok, instagram, youtube]

  brief: >
    Founder stories. Favour moments with real stakes (money, failure, near-quitting)
    over generic advice.

  source:
    - ../footage/episode-142.mp4   # relative to this file; or add later with `clipper source add`

  # Optional: override rubric weights (renormalised to sum to 1).
  # weights: {hook: 0.30, retention: 0.20, context: 0.15, emotion: 0.10, novelty: 0.10, comment: 0.05, campaign_fit: 0.10}
